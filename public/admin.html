<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

body{
font-family:sans-serif;
background:#f5f6f8;
padding:40px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

img{
max-width:200px;
margin-top:10px;
}

button{
padding:8px 12px;
background:red;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<h2>신고 목록</h2>

<div id="reports"></div>

<script>

async function load(){

const res=await fetch("/admin/reports")

const data=await res.json()

const box=document.getElementById("reports")

box.innerHTML=""

data.reverse().forEach(r=>{

const div=document.createElement("div")

div.className="card"

div.innerHTML=`
<b>신고자:</b> ${r.user}<br>
<b>내용:</b> ${r.description}<br>
<b>시간:</b> ${r.time}
${r.image ? `<img src="${r.image}">` : ""}
<br>
<button onclick="del(${r.id})">삭제</button>
`

box.appendChild(div)

})

}

async function del(id){

await fetch("/admin/delete/"+id,{method:"DELETE"})

load()

}

load()

</script>

</body>
</html>

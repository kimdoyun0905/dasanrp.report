<link rel="stylesheet" href="/css/ui.css">

<div class="nav">
<div class="logo">관리자 패널</div>
<button class="button" onclick="logout()">로그아웃</button>
</div>

<div class="container">

<div class="card">

<div class="title">신고 목록</div>

<div id="reports"></div>

</div>

</div>

<script>

async function load(){

const res=await fetch("/admin/reports")
const data=await res.json()

const box=document.getElementById("reports")
box.innerHTML=""

data.reverse().forEach(r=>{

box.innerHTML+=`
<div class="report">

<b>신고자:</b> ${r.user}<br>
<b>내용:</b> ${r.description}<br>
<b>시간:</b> ${r.time}

${r.image?`<br><img src="${r.image}">`:""}

<br><br>

<button class="button button-red" onclick="del(${r.id})">
삭제
</button>

</div>
`

})

}

async function del(id){
await fetch("/admin/delete/"+id,{method:"DELETE"})
load()
}

async function logout(){
await fetch("/logout")
location.href="/login.html"
}

load()

</script>

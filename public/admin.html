<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>

body{
margin:0;
font-family:Pretendard;
background:#f5f6f8;
padding:40px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

img{
max-width:200px;
display:block;
margin-top:10px;
}

button{
margin-top:10px;
padding:8px 14px;
border:none;
border-radius:8px;
background:red;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<h2>신고 목록</h2>

<div id="reports"></div>

<script>

async function loadReports(){

const res=await fetch("/admin/reports")

const data=await res.json()

const container=document.getElementById("reports")

container.innerHTML=""

data.reverse().forEach(r=>{

const div=document.createElement("div")
div.className="card"

div.innerHTML=`
<b>신고자:</b> ${r.user}<br>
<b>내용:</b> ${r.description}<br>
<b>시간:</b> ${r.time}
${r.image ? `<img src="${r.image}">`:""}
<button onclick="del(${r.id})">삭제</button>
`

container.appendChild(div)

})

}

async function del(id){

await fetch("/admin/delete/"+id,{method:"DELETE"})

loadReports()

}

loadReports()

</script>

</body>
</html>

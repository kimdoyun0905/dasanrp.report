<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항</title>
<style>
*{box-sizing:border-box}
:root{
  --orange:#ff8a3d;
  --orange2:#ffb347;
  --line:#ececec;
  --muted:#6b7280;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#ffffff,#fff7ec);
  color:#222;
}
.wrapper{
  max-width:1100px;
  margin:0 auto;
  padding:0 20px 60px;
}
.navbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.menu{
  display:flex;
  align-items:center;
  gap:14px;
}
.menu a, .menu button{
  border:none;
  background:none;
  text-decoration:none;
  color:#444;
  font-weight:800;
  cursor:pointer;
}
.header{
  padding:42px 0 18px;
}
.header h1{
  margin:0;
  font-size:40px;
}
.header p{
  margin:12px 0 0;
  color:var(--muted);
}
.layout{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:24px;
  margin-top:26px;
}
.card{
  background:white;
  border-radius:24px;
  padding:26px;
  box-shadow:0 18px 45px rgba(0,0,0,.08);
}
.notice-list{
  display:grid;
  gap:14px;
}
.notice-item{
  border:1px solid #efefef;
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
}
.notice-item:hover{
  background:#fff8f0;
  transform:translateY(-2px);
}
.notice-title{
  font-weight:900;
  font-size:18px;
  line-height:1.5;
}
.notice-meta{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
}
.notice-detail h2{
  margin-top:0;
  line-height:1.5;
}
.notice-content{
  white-space:pre-wrap;
  color:#444;
  line-height:1.9;
}
label{
  display:block;
  margin:14px 0 8px;
  font-weight:800;
}
input, textarea{
  width:100%;
  padding:14px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  font-size:15px;
}
textarea{
  min-height:180px;
  resize:vertical;
}
button.primary{
  width:100%;
  margin-top:16px;
  padding:15px 16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(45deg,var(--orange),var(--orange2));
  color:white;
  font-weight:900;
  cursor:pointer;
}
.badge{
  display:inline-block;
  margin-top:10px;
  background:#fff3e7;
  color:var(--orange);
  padding:8px 12px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
}
.msg{
  margin-top:14px;
  min-height:22px;
  font-weight:800;
}
.ok{color:#16a34a}
.err{color:#e11d48}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .header h1{font-size:32px}
}
</style>
</head>
<body>
<div class="navbar">
  <div class="wrapper">
    <div class="nav-inner">
      <div style="font-weight:900;font-size:20px;">공지사항</div>
      <div class="menu">
        <a href="/index.html">홈</a>
        <a href="/notice.html">공지</a>
        <a href="/report.html">신고</a>
        <button id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </div>
</div>

<div class="wrapper">
  <div class="header">
    <h1>공지사항</h1>
    <p>최신 공지를 확인하고, 관리자는 이 페이지에서 직접 공지를 추가할 수 있습니다.</p>
    <div id="adminBadge" class="badge" style="display:none">관리자 공지 작성 가능</div>
  </div>

  <div class="layout">
    <div class="card">
      <h2 style="margin-top:0">공지 목록</h2>
      <div class="notice-list" id="noticeList"></div>
    </div>

    <div class="card notice-detail">
      <div id="detailArea">
        <h2>공지를 선택하세요</h2>
        <div class="notice-content">왼쪽 공지 목록에서 항목을 누르면 상세 내용이 이곳에 표시됩니다.</div>
      </div>

      <div id="adminPanel" style="display:none; margin-top:28px; border-top:1px solid #eee; padding-top:24px;">
        <h2 style="margin-top:0">공지 작성</h2>

        <label>제목</label>
        <input id="noticeTitle" placeholder="공지 제목 입력">

        <label>내용</label>
        <textarea id="noticeContent" placeholder="공지 내용을 입력하세요"></textarea>

        <button class="primary" id="addNoticeBtn">공지 추가</button>
        <div class="msg" id="msgText"></div>
      </div>
    </div>
  </div>
</div>

<script>
let meUser = null;
let notices = [];

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderList() {
  const list = document.getElementById("noticeList");

  if (!notices.length) {
    list.innerHTML = `<div class="notice-item"><div class="notice-title">등록된 공지가 없습니다.</div></div>`;
    return;
  }

  list.innerHTML = notices.map(n => `
    <div class="notice-item" data-id="${n.id}">
      <div class="notice-title">${escapeHtml(n.title)}</div>
      <div class="notice-meta">${escapeHtml(n.author)} · ${escapeHtml(n.createdAt)}</div>
    </div>
  `).join("");

  list.querySelectorAll(".notice-item[data-id]").forEach(el => {
    el.addEventListener("click", () => {
      const id = Number(el.dataset.id);
      const notice = notices.find(n => n.id === id);
      if (!notice) return;

      document.getElementById("detailArea").innerHTML = `
        <h2>${escapeHtml(notice.title)}</h2>
        <div class="notice-meta" style="margin-bottom:16px">${escapeHtml(notice.author)} · ${escapeHtml(notice.createdAt)}</div>
        <div class="notice-content">${escapeHtml(notice.content)}</div>
      `;
      history.replaceState(null, "", `/notice.html?id=${id}`);
    });
  });
}

async function loadNotices() {
  const res = await fetch("/api/notices");
  const data = await res.json();

  if (!data.success) {
    location.href = "/login.html";
    return;
  }

  notices = data.notices || [];
  renderList();

  const params = new URLSearchParams(location.search);
  const selectedId = Number(params.get("id"));
  const selected = notices.find(n => n.id === selectedId) || notices[0];

  if (selected) {
    document.getElementById("detailArea").innerHTML = `
      <h2>${escapeHtml(selected.title)}</h2>
      <div class="notice-meta" style="margin-bottom:16px">${escapeHtml(selected.author)} · ${escapeHtml(selected.createdAt)}</div>
      <div class="notice-content">${escapeHtml(selected.content)}</div>
    `;
  }
}

async function boot() {
  const meRes = await fetch("/api/me");
  const me = await meRes.json();

  if (!me.loggedIn) {
    location.href = "/login.html";
    return;
  }

  meUser = me.user;

  if (me.user.robloxUsername === "Sunandfriend2296") {
    document.getElementById("adminPanel").style.display = "block";
    document.getElementById("adminBadge").style.display = "inline-block";
  }

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    location.href = "/login.html";
  });

  await loadNotices();
}

document.getElementById("addNoticeBtn").addEventListener("click", async () => {
  const title = document.getElementById("noticeTitle").value.trim();
  const content = document.getElementById("noticeContent").value.trim();
  const msg = document.getElementById("msgText");

  msg.className = "msg";
  msg.textContent = "";

  if (!title || !content) {
    msg.className = "msg err";
    msg.textContent = "제목과 내용을 입력하세요.";
    return;
  }

  const res = await fetch("/api/notices", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, content }),
  });

  const data = await res.json();

  if (!data.success) {
    msg.className = "msg err";
    msg.textContent = data.message || "공지 추가에 실패했습니다.";
    return;
  }

  document.getElementById("noticeTitle").value = "";
  document.getElementById("noticeContent").value = "";
  msg.className = "msg ok";
  msg.textContent = "공지 추가가 완료되었습니다.";

  await loadNotices();
});

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

<style>

body{
margin:0;
font-family:Pretendard;
background:#f5f6f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:500px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

textarea{
width:100%;
height:120px;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
margin-bottom:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:black;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<h2>유저 신고</h2>

<button onclick="generate()">인증코드 생성</button>
<div id="code"></div>

<form action="/report" method="POST" enctype="multipart/form-data">

<textarea name="description" placeholder="신고 내용"></textarea>

<input type="file" name="image">

<button type="submit">신고 제출</button>

</form>

</div>

<script>

async function generate(){

const res=await fetch("/generate-code",{credentials:"include"})
const data=await res.json()

document.getElementById("code").innerText="인증코드: "+data.code

}

</script>

</body>
</html>
